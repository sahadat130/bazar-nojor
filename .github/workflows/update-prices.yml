name: Update bazar prices

on:
  schedule:
    - cron: "0 3 * * *"   # 09:00 Asia/Dhaka
    - cron: "0 9 * * *"   # 15:00 Asia/Dhaka, retry if the morning scrape failed
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        id: scrape
        continue-on-error: true
        run: npm run scrape

      - name: Commit updated data.json to main
        id: commit
        if: steps.scrape.outcome == 'success'
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json unchanged, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: daily price update from tcb.gov.bd"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # continue-on-error above keeps a flaky tcb.gov.bd from blocking the
      # commit of already-fetched data, but the run must still show as failed.
      - name: Fail the run if the scrape failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scraper failed; see the Run scraper step."
          exit 1
